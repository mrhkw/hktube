<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">HkTube signal icon</title>
  <desc id="desc">Three close, slightly italic rounded signal bars in teal, cyan blue, and amber on a dark navy-purple background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#302c53"/>
      <stop offset="0.5" stop-color="#242342"/>
      <stop offset="1" stop-color="#17172f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#21b9bb"/>
      <stop offset="0.55" stop-color="#4be2d3"/>
      <stop offset="1" stop-color="#92f2dc"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#23a9e8"/>
      <stop offset="0.55" stop-color="#58d6ef"/>
      <stop offset="1" stop-color="#a0eff5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f08a43"/>
      <stop offset="0.55" stop-color="#ffb657"/>
      <stop offset="1" stop-color="#ffe092"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#080817" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="13.5" y="13.5" width="485" height="485" rx="110.5" fill="none" stroke="#514d79" stroke-width="3" opacity="0.8"/>
  <g transform="skewX(-8)" stroke="#fff" stroke-width="6" stroke-opacity="0.16">
    <rect x="174" y="177" width="78" height="183" rx="39" fill="url(#teal)"/>
    <rect x="242" y="119" width="78" height="241" rx="39" fill="url(#blue)"/>
    <rect x="310" y="151" width="78" height="209" rx="39" fill="url(#amber)"/>
  </g>
</svg>
